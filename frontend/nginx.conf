# Sirve la salida del build de Angular: páginas públicas prerenderizadas (HTML por ruta) y el shell
# de cliente (index.csr.html) para las rutas privadas y las desconocidas. Las peticiones /api las
# enruta Caddy directamente al backend, así que aquí no hay proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ficheros con hash en el nombre: cache inmutable.
    location ~* -[A-Za-z0-9]{6,}\.(js|css|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo lo demás: revalidar siempre; HTML prerenderizado por ruta antes del shell de cliente.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
