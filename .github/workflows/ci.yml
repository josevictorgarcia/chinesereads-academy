name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detectar partes del repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.probe.outputs.backend }}
      frontend: ${{ steps.probe.outputs.frontend }}
      docker: ${{ steps.probe.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          echo "backend=$([ -f backend/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker=$([ -f backend/Dockerfile ] && [ -f frontend/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  contract:
    name: Frontera con ChineseReads y limpieza del repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sin referencias a herramientas en el repositorio
        run: scripts/check-no-ai-refs.sh
      - name: Lock de frontera frente al repositorio matriz (GitHub, main)
        run: scripts/check-chinesereads-contract.sh --source github

  backend:
    name: Backend (Maven, Testcontainers)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + tests
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Diagramas de módulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: backend/target/spring-modulith-docs
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, build, tests)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Formato (Prettier)
        working-directory: frontend
        run: npm run format:check
      - name: Build (producción, con prerender)
        working-directory: frontend
        run: npm run build -- --configuration production
      - name: Tests
        working-directory: frontend
        run: npm test -- --watch=false

  docker-build:
    name: Imágenes Docker (solo build)
    needs: [detect, backend, frontend]
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t academy-backend:ci backend
      - run: docker build -t academy-frontend:ci frontend
